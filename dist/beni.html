function rounded(g,w,h,d,pos,material,r=.08){

function sphere(g,r,pos,material,scale){

function disc(g,r,depth,pos,material){
 const m=new T.Mesh(new T.CylinderGeometry(r,r,depth,48),material);m.rotation.x=Math.PI/2;m.position.set(pos[0],pos[1],pos[2]);m.castShadow=true;g.add(m);return m;

function link(g,a,b,r1,r2,material){
 const start=new T.Vector3(a[0],a[1],a[2]),end=new T.Vector3(b[0],b[1],b[2]),dir=end.clone().sub(start);
 const m=new T.Mesh(new T.CylinderGeometry(r2,r1,dir.length(),28,1),material);m.position.copy(start.clone().add(end).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir.normalize());m.castShadow=true;g.add(m);return m;

function addWheel(g,x){

 const tire=new T.Mesh(new T.CylinderGeometry(.39,.39,.23,64,1),rubber);tire.rotation.z=Math.PI/2;tire.castShadow=true;w.add(tire);
 const outer=new T.Mesh(new T.TorusGeometry(.34,.07,16,64),mat(0x555d66,.75));outer.rotation.y=Math.PI/2;w.add(outer);

 return w;

const body=part('chassis',[0,1.36,0]);rounded(body,1.32,.84,.72,[0,0,0],white,.22);rounded(body,1.18,.55,.045,[0,-.02,.37],white2,.12);
const chest=part('sensors',[0,1.36,0]);
[-.39,.39].forEach(function(x){disc(chest,.095,.06,[x,-.19,.414],dark);sphere(chest,.047,[x,-.19,.45],mat(0x6d91b4,.2,.2),[1,1,.35]);});
const battery=part('battery',[0,1.36,0]);rounded(battery,.58,.48,.3,[0,-.03,-.13],mat(0xb5bec9,.46),.055);rounded(battery,.42,.3,.035,[0,-.03,-.292],mat(0x8996a4,.55),.025);
const board=part('control',[0,1.36,0]);rounded(board,.64,.43,.045,[0,.02,.1],mat(0x344d66,.5),.025);
[-.2,0,.2].forEach(function(x){rounded(board,.12,.12,.035,[x,.02,.14],mat(0x8b9ba9,.42),.015)});
rounded(board,.18,.16,.04,[0,.12,.14],mat(0x1c2936,.4),.015);
const legs=part('legs',[0,0,0]);
[-1,1].forEach(function(side){
 const sx=side*.56, knee=side*.86, wheelX=side*.92;
 const shoulder=new T.Mesh(new T.CylinderGeometry(.19,.19,.18,48),white2);shoulder.rotation.z=Math.PI/2;shoulder.position.set(sx,1.47,.02);shoulder.castShadow=true;legs.add(shoulder);
 const shoulderCap=new T.Mesh(new T.CylinderGeometry(.12,.12,.2,40),metal);shoulderCap.rotation.z=Math.PI/2;shoulderCap.position.set(sx+side*.1,1.47,.02);legs.add(shoulderCap);
 link(legs,[sx,1.45,.02],[knee,1.02,.02],.12,.16,white);
 const joint=new T.Mesh(new T.CylinderGeometry(.16,.16,.22,40),white2);joint.rotation.z=Math.PI/2;joint.position.set(knee,1.02,.02);legs.add(joint);
 link(legs,[knee,1.02,.02],[wheelX,.62,.02],.12,.14,white);

[-.92,.92].forEach(function(x){const m=new T.Mesh(new T.CylinderGeometry(.2,.2,.28,48),metal);m.rotation.z=Math.PI/2;m.position.set(x,.48,.02);m.castShadow=true;drive.add(m);const c=new T.Mesh(new T.CylinderGeometry(.12,.12,.3,40),dark);c.rotation.z=Math.PI/2;c.position.set(x,.48,.02);drive.add(c)});

const groupsForExplosion={head:[0,1.0,0],camera:[0,1.55,.25],chassis:[0,-.25,0],sensors:[0,.05,.95],battery:[0,.1,-.95],control:[0,.45,.85],legs:[0,-.72,0],drive:[1.05,.1,0],wheels:[-1.05,-.1,0],tracker:[1.7,.2,.4]};

Object.keys(parts).forEach(function(id){original[id]=parts[id].map(function(g){return g.position.clone()})});
const focusByStep={camera:'camera',sensors:'sensors',tracker:'tracker',control:'control',drive:'drive',legs:'legs',head:'head'};

 activePart=id;
 Object.keys(parts).forEach(function(key){parts[key].forEach(function(g){g.traverse(function(o){if(o.isMesh&&o.material&&o.material.emissive){o.material.emissive.set(key===id?0x2c78c8:0x000000);o.material.emissiveIntensity=key===id?.34:0}})})});
}
function setExplode(value){
 exploded=value;
 Object.keys(parts).forEach(function(id){parts[id].forEach(function(g){const offset=value?(groupsForExplosion[id]||[0,0,0]):[0,0,0];g.userData.target=g.userData.home.clone().add(new T.Vector3(offset[0],offset[1],offset[2]));})});
}
const energyCurves=[],signalCurves=[],particles=[];
function addPath(points,color,dashed,phase){
 const curve=new T.CatmullRomCurve3(points.map(function(p){return new T.Vector3(p[0],p[1],p[2])}));
 const lineGeom=new T.BufferGeometry().setFromPoints(curve.getPoints(80));
 const lineMat=dashed?new T.LineDashedMaterial({color:color,dashSize:.075,gapSize:.055,transparent:true,opacity:.85}):new T.LineBasicMaterial({color:color,transparent:true,opacity:.72});
 const line=new T.Line(lineGeom,lineMat);if(dashed)line.computeLineDistances();line.visible=false;scene.add(line);
 const dot=new T.Mesh(new T.SphereGeometry(.035,16,12),new T.MeshBasicMaterial({color:color}));dot.visible=false;scene.add(dot);
 (dashed?signalCurves:energyCurves).push({curve:curve,line:line,dot:dot,phase:phase||0});
}
addPath([[0,1.33,-.25],[0,1.5,.18],[0,1.42,.52],[0,1.45,.9]],0x4e91d6,false,0);

addPath([[0,1.43,.18],[.5,1.25,.2],[.92,.72,.02]],0x8a9dc2,true,.8);

function resize(){
 if(!renderer)return;
 const w=stage.clientWidth,h=stage.clientHeight;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function animate(t){
 requestAnimationFrame(animate);
 const sec=t*.001;
 if(workMode&&t-lastAdvance>3300){currentStep=(currentStep+1)%flows[currentFlow].length;updateStep();}
 const follow=workMode&&currentFlow==='follow';
 const terrain=workMode&&currentFlow==='terrain';
 if(follow||terrain){
  headShell.rotation.y=Math.sin(sec*1.05)*.11;
  optics.rotation.y=headShell.rotation.y;
  headShell.rotation.x=Math.sin(sec*.8)*.045;
  optics.rotation.x=headShell.rotation.x;
  
  wheelMeshes.forEach(function(w,i){w.rotation.x=sec*3.5*(i===0?1:-1)});
  legs.rotation.z=Math.sin(sec*2)*.025;
 }else{
  headShell.rotation.set(0,0,0);optics.rotation.set(0,0,0);legs.rotation.z=0;
  wheelMeshes.forEach(function(w){w.rotation.set(0,0,0)});
 }

 if(terrain&&currentStep>=2&&currentStep<=5){legs.rotation.z=Math.sin(sec*5)*.16;body.position.y=1.36+Math.abs(Math.sin(sec*5))*.12;wheelMeshes.forEach(function(w){w.rotation.x=sec*5})}

 energyCurves.concat(signalCurves).forEach(function(p){const on=workMode;p.line.visible=on;p.dot.visible=on;if(on)p.dot.position.copy(p.curve.getPoint((sec*.28+p.phase)%1))});
 if(controls)controls.update();
 if(renderer)renderer.render(scene,camera);
}
root.traverse(function(o){if(o.isMesh&&o.material){o.material=Array.isArray(o.material)?o.material.map(function(m){return m.clone()}):o.material.clone()}});

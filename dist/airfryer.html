const D={whole:{name:'空气炸锅',spec:[['容量','6.2 L'],['额定功率','1700 W'],['温度范围','40–200 °C'],['烹饪功能','16 种']]},shell:{name:'外壳',what:'包覆并支撑内部组件，隔离高温区域。',spec:[['材质','耐热塑料（示意）'],['工艺','注塑成型（示意）']]},pan:{name:'炸锅与炸篮',what:'承载食材并配合风道引导热空气流经烹饪区。',spec:[['容量','6.2 L（参考整机）'],['表面','不粘涂层（示意）']]},heater:{name:'加热管',what:'将电能转化为热能，加热流经加热管的空气。',spec:[['类型','电阻加热（示意）']]},fan:{name:'风扇组件',what:'电机驱动叶轮形成强制对流，推动热空气在腔体内循环。',spec:[['组成','电机与叶轮（示意）']]},control:{name:'控制电路板',what:'接收用户设置与温度信号，控制加热和运行状态。',spec:[['控制','温度与时间（示意）']]},sensor:{name:'温度传感器',what:'检测烹饪腔温度并向控制电路反馈，参与温度调节。',spec:[['类型','热敏传感器（示意）']]},interlock:{name:'炸锅位置开关',what:'检测炸锅是否就位，供控制系统判断运行状态。',spec:[['作用','抽出时暂停（示意）']]}};
const steps=[['接入电源','电能从整机电源输入端进入，控制系统进入待机。','control'],['设定烹饪参数','控制面板接收温度与时间设定，启动烹饪。','control'],['炸锅位置判断','位置开关检测炸锅是否就位；未就位时暂停。','interlock'],['加热管通电','控制电路接通加热回路，加热管将电能转化为热能。','heater'],['风扇推动气流','电机驱动风扇，空气流经加热管后进入烹饪腔。','fan'],['热空气循环','热空气沿炸篮与锅体之间的空间循环，将热量传递至食材区域。','pan'],['温度反馈与调节','传感器反馈腔温；控制电路依据设定调节加热，形成循环。','sensor'],['烹饪结束','计时结束后停止加热，结束烹饪；冷却策略依具体机型而定。','control']];
const stage=document.querySelector('#stage'),canvas=document.querySelector('#view');let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true})}catch(e){stage.insertAdjacentHTML('beforeend','<p style="position:absolute;top:42%;left:30%;color:#666">当前浏览器无法显示 3D 模型</p>');renderer={setPixelRatio(){},setSize(){},render(){},set outputColorSpace(v){}}}renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene(),camera=new T.PerspectiveCamera(36,1,.1,100);camera.position.set(6,5,8);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.target.set(0,1.45,0);scene.add(new T.HemisphereLight(0xffffff,0x9097a0,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,7,5);scene.add(light);const root=new T.Group();scene.add(root);let parts={};function box(id,w,h,d,x,y,z,col,opacity=1){const mesh=new T.Mesh(new T.BoxGeometry(w,h,d,4,4,4),new T.MeshStandardMaterial({color:col,roughness:.42,transparent:opacity<1,opacity}));mesh.position.set(x,y,z);mesh.userData.origin=mesh.position.clone();mesh.userData.id=id;root.add(mesh);(parts[id]??=[]).push(mesh);return mesh}function cyl(id,r,h,x,y,z,col){const o=new T.Mesh(new T.CylinderGeometry(r,r,h,48),new T.MeshStandardMaterial({color:col,metalness:.55,roughness:.38}));o.position.set(x,y,z);o.userData.origin=o.position.clone();o.userData.id=id;root.add(o);(parts[id]??=[]).push(o);return o}
box('shell',2.8,.22,2.5,0,.12,0,0x34383d);box('shell',.16,2.3,2.5,-1.32,1.35,0,0xd7d9da,.45);box('shell',.16,2.3,2.5,1.32,1.35,0,0xd7d9da,.45);box('shell',2.8,2.3,.16,0,1.35,-1.18,0xd7d9da,.48);box('shell',2.8,.42,2.5,0,2.67,0,0xe7e8e9);box('control',1,.12,.5,0,2.93,.42,0x242b31);box('pan',2.15,.14,1.9,0,.38,.12,0x454b4e);box('pan',.12,1.25,1.9,-1.02,1.03,.12,0x6c7477);box('pan',.12,1.25,1.9,1.02,1.03,.12,0x6c7477);box('pan',2.15,1.25,.12,0,1.03,.99,0x5a6164);box('pan',2.15,1.25,.12,0,1.03,-.76,0x5a6164);box('pan',.55,.18,.32,0,1.15,1.23,0x292d30);cyl('fan',.48,.17,0,2.33,0,0x5e6872);for(let i=0;i<5;i++){const b=box('fan',.6,.04,.14,0,2.2,0,0x73838d);b.rotation.y=i*Math.PI/2.5;b.position.set(Math.cos(i*Math.PI/2.5)*.35,2.2,Math.sin(i*Math.PI/2.5)*.35);b.userData.origin=b.position.clone()};const ring=new T.Mesh(new T.TorusGeometry(.72,.045,12,64),new T.MeshStandardMaterial({color:0xb67442,metalness:.8,roughness:.3}));ring.rotation.x=Math.PI/2;ring.position.y=1.97;ring.userData.origin=ring.position.clone();ring.userData.id='heater';root.add(ring);parts.heater=[ring];box('sensor',.13,.3,.13,1,1.85,-.5,0xa6afb5);box('interlock',.18,.22,.18,1.07,.48,.8,0xd8b76d);
const flow=new T.Group();root.add(flow);const dots=[];for(let i=0;i<16;i++){let m=new T.Mesh(new T.SphereGeometry(.045,10,10),new T.MeshBasicMaterial({color:0xf29b4b}));flow.add(m);dots.push(m)}flow.visible=false;let active='whole',isWork=false,exploded=false,step=0,started=performance.now();const info=document.querySelector('#info'),tree=document.querySelector('#treeList'),list=document.querySelector('#stepList');function select(id){active=id;for(const [key,arr] of Object.entries(parts))for(const o of arr){o.material.emissive?.set(key===id?0x2475d1:0x000000);o.material.emissiveIntensity=.5}tree.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const d=D[id];info.innerHTML=`<h1>${d.name}</h1>${id==='whole'?'<a target="_blank" rel="noopener" href="https://www.philips.co.uk/c-p/NA332_09/3000-series-airfryer-6.2l/overview">参考型号：Philips NA332/09 ↗</a>':''}${d.what?'<h4>功能</h4><p>'+d.what+'</p>':''}<h4>核心参数</h4><dl>${d.spec.map(s=>'<dt>'+s[0]+'</dt><dd>'+s[1]+'</dd>').join('')}</dl>${id==='whole'?'<p class="note">模型和内部结构为示意。</p>':''}`}
[['整机',['whole']],['外观与烹饪组件',['shell','pan']],['加热与循环组件',['heater','fan']],['控制与检测组件',['control','sensor','interlock']]].forEach(([g,ids])=>{tree.insertAdjacentHTML('beforeend','<div class="group">'+g+'</div>');ids.forEach(id=>{let b=document.createElement('button');b.textContent=D[id].name;b.dataset.id=id;b.onclick=()=>select(id);tree.append(b)})});steps.forEach(([a,b],i)=>{let el=document.createElement('button');el.innerHTML='<b>'+String(i+1).padStart(2,'0')+'　'+a+'</b><small>'+b+'</small>';el.onclick=()=>{step=i;started=performance.now();updateStep()};list.append(el)});function updateStep(){list.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===step));select(steps[step][2]);document.querySelector('#label strong').textContent=steps[step][0];flow.visible=step===4||step===5;}
document.querySelector('#mode').onclick=()=>{isWork=!isWork;document.body.classList.toggle('workflow',isWork);document.querySelector('#mode').textContent=isWork?'← 产品结构':'工作原理 →';document.querySelector('#explode').hidden=isWork;document.querySelector('#label').hidden=!isWork;if(isWork){step=0;started=performance.now();exploded=false;updateStep()}else{flow.visible=false;select('whole')}};document.querySelector('#explode').onclick=()=>{exploded=!exploded;document.querySelector('#explode').textContent=exploded?'收合结构':'展开结构'};document.querySelector('#reset').onclick=()=>{camera.position.set(6,5,8);controls.target.set(0,1.45,0);controls.update()};function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function animate(t){requestAnimationFrame(animate);if(isWork&&t-started>7000){step=(step+1)%steps.length;started=t;updateStep()}for(const [id,arr] of Object.entries(parts))for(const o of arr){let off=exploded?({shell:-.3,pan:-.2,heater:.55,fan:1.05,control:1.5,sensor:.35,interlock:0}[id]||0):0;o.position.y+=(o.userData.origin.y+off-o.position.y)*.09}dots.forEach((m,i)=>{let a=(t*.0012+i*Math.PI*2/16)%(Math.PI*2);m.position.set(Math.sin(a)*.75,1.15+Math.cos(a)*.73,.2);});controls.update();renderer.render(scene,camera)}select('whole');resize();requestAnimationFrame(animate);
